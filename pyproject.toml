[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-research"
version = "0.2.0"
description = "Agent-neutral, source-backed investment research framework"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
invest-research = "invest_research.__main__:main"

[tool.setuptools.packages.find]
include = ["invest_research*"]

