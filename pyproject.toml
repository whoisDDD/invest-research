[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-research"
version = "0.4.1"
description = "Agent-neutral, source-backed investment research framework"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
research-data = ["pandas>=2.0,<3", "xlrd>=2.0,<3", "pypdf>=5,<7"]

[project.scripts]
invest-research = "invest_research.__main__:main"

[tool.setuptools.packages.find]
include = ["invest_research*"]

[tool.setuptools.package-data]
invest_research = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.json", "ui/*.csv"]

